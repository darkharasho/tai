name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: daemon/go.sum
      - run: npm ci
      - run: npm run build
      - run: cd daemon && go test ./...
      - run: npm test

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: daemon/go.sum
      - run: npm ci
      - run: npm run build
      - name: Build daemon binaries
        run: cd daemon && make all
      - name: Build Linux
        run: npx electron-builder --linux AppImage --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/latest-linux.yml

  build-windows:
    needs: test
    # Pinned to windows-2022 (VS 2022). GitHub rolled windows-latest to a
    # VS 2026 image (windows-2025-vs2026) that the bundled node-gyp can't
    # detect, breaking the node-pty electron-rebuild ("Could not find any
    # Visual Studio installation"). VS 2022 is detected fine.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: daemon/go.sum
      - run: npm ci
      - run: npm run build
      - name: Build daemon binaries
        shell: bash
        run: |
          cd daemon
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/tai-daemon-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/tai-daemon-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/tai-daemon-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/tai-daemon-darwin-arm64 .
      - name: Build Windows
        # npmRebuild is disabled in package.json build config; the gated postinstall
        # (electron-rebuild --only node-pty on Windows) prepares native modules, so
        # electron-builder never tries to rebuild POSIX-only node-termios here.
        run: npx electron-builder --win --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: daemon/go.sum
      - run: npm ci
      - run: npm run build
      - name: Build daemon binaries
        run: cd daemon && make all
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}
          keychain: signing_temp
      - name: Build macOS
        # Do not set CSC_LINK here. electron-builder would then build its own
        # keychain and call `security set-key-partition-list -k` with the p12
        # password instead of the keychain password, which macOS 25.6 rejects.
        # Pointing at a keychain we imported ourselves skips that path.
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_KEYCHAIN: signing_temp
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  finalize:
    needs: [build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are derived from the commit range since the previous
          # tag, so the fallback below needs full history and tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Ensure release exists
        # The release skill normally pre-creates a draft with hand-written
        # notes. If it did not, build notes from conventional commits rather
        # than --generate-notes, whose body is just a "Full Changelog" link
        # and shows up in the app's What's New modal as a bare link.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node scripts/release-notes.mjs "$TAG" > /tmp/release-notes.md
            gh release create "$TAG" --draft --title "$TAG" --notes-file /tmp/release-notes.md
          fi
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to GitHub Release
        run: find artifacts -type f -print0 | xargs -0 gh release upload ${{ github.ref_name }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Undraft release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
